services:
  db:
    image: postgres:15-alpine
    container_name: retur_postgres_5434
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: retur_db
    ports:
      - "5434:5432"
    volumes:
      - retur_postgres_data_5434:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: retur_pgadmin_5434
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  retur_postgres_data_5434:
